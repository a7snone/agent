<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Chat</title>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --border: #e5e3df;
    --text: #1f1e1d;
    --muted: #8a8782;
    --accent: #cc785c;
    --accent-text: #ffffff;
    --bubble-agent: #f0efec;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  #app {
    max-width: 720px;
    margin: 0 auto;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 16px;
  }
  header {
    padding: 8px 4px 16px;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 600;
  }
  header p {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--muted);
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 8px 4px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.45;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: var(--accent-text);
    border-bottom-right-radius: 4px;
  }
  .msg.agent {
    align-self: flex-start;
    background: var(--bubble-agent);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: flex-start;
    background: #fbe8e6;
    color: #9c3a2e;
    border: 1px solid #f2c6bf;
  }
  .msg.pending {
    color: var(--muted);
    font-style: italic;
  }
  form#composer {
    display: flex;
    gap: 8px;
    padding: 12px 4px 4px;
    border-top: 1px solid var(--border);
  }
  #input {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    background: var(--panel);
    color: var(--text);
  }
  #input:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }
  button#send {
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    padding: 0 18px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button#send:disabled {
    opacity: 0.5;
    cursor: default;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Agent Chat</h1>
    <p>Ask anything — the agent can use its tools (calculator, time, files) when it needs to.</p>
  </header>
  <div id="messages"></div>
  <form id="composer">
    <textarea id="input" rows="1" placeholder="Type a message..." autofocus></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("composer");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  const sessionId = (() => {
    let id = localStorage.getItem("agent_session_id");
    if (!id) {
      id = crypto.randomUUID();
      localStorage.setItem("agent_session_id", id);
    }
    return id;
  })();

  function addMessage(text, cls) {
    const div = document.createElement("div");
    div.className = `msg ${cls}`;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;

    const pending = addMessage("Thinking...", "agent pending");

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });
      const data = await res.json();
      pending.remove();
      if (!res.ok) {
        addMessage(data.error || "Something went wrong.", "error");
      } else {
        addMessage(data.reply, "agent");
      }
    } catch (err) {
      pending.remove();
      addMessage("Network error: " + err.message, "error");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
