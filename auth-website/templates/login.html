{% extends "layout.html" %}
{% block title %}تسجيل الدخول{% endblock %}
{% block content %}
  <section class="form-card">
    <h1>تسجيل الدخول</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" novalidate>
      <label for="identifier">اسم المستخدم أو البريد الإلكتروني</label>
      <input type="text" id="identifier" name="identifier" value="{{ identifier }}" required>

      <label for="password">كلمة المرور</label>
      <input type="password" id="password" name="password" required>

      <button type="submit" class="btn">دخول</button>
    </form>
    <p>ليس لديك حساب؟ <a href="{{ url_for('register') }}">إنشاء حساب</a></p>
  </section>
{% endblock %}
