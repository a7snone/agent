{% extends "layout.html" %}
{% block title %}إنشاء حساب{% endblock %}
{% block content %}
  <section class="form-card">
    <h1>إنشاء حساب جديد</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" novalidate>
      <label for="username">اسم المستخدم</label>
      <input type="text" id="username" name="username" value="{{ username }}" required minlength="3" maxlength="32">

      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" name="email" value="{{ email }}" required>

      <label for="password">كلمة المرور</label>
      <input type="password" id="password" name="password" required minlength="8">

      <button type="submit" class="btn">إنشاء الحساب</button>
    </form>
    {% if google_oauth_enabled %}
      <div class="divider">أو</div>
      <a class="btn btn-google" href="{{ url_for('google_login') }}">التسجيل عبر جوجل</a>
    {% endif %}
    <p>لديك حساب بالفعل؟ <a href="{{ url_for('login') }}">تسجيل الدخول</a></p>
  </section>
{% endblock %}
