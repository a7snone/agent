{% extends "layout.html" %}
{% block title %}محتوى جديد{% endblock %}
{% block content %}
  <section class="form-card">
    <h1>إضافة محتوى جديد</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" novalidate>
      <label for="kind">نوع المحتوى</label>
      <select id="kind" name="kind">
        <option value="news" {% if kind == 'news' %}selected{% endif %}>خبر</option>
        <option value="video" {% if kind == 'video' %}selected{% endif %}>مقطع فيديو</option>
      </select>

      <label for="title">العنوان</label>
      <input type="text" id="title" name="title" value="{{ title }}" required minlength="3" maxlength="200">

      <label for="body" id="body-label">نص الخبر</label>
      <textarea id="body" name="body" rows="8" required>{{ body }}</textarea>
      <p class="meta" style="color: var(--muted); font-size: 0.85rem;">
        للفيديو: ضع رابط المقطع (مثلاً رابط يوتيوب أو ملف mp4 مباشر).
      </p>

      <button type="submit" class="btn">نشر</button>
    </form>
  </section>

  <script>
    const kindSelect = document.getElementById('kind');
    const bodyLabel = document.getElementById('body-label');
    const bodyField = document.getElementById('body');
    function syncLabel() {
      if (kindSelect.value === 'video') {
        bodyLabel.textContent = 'رابط الفيديو';
        bodyField.rows = 2;
      } else {
        bodyLabel.textContent = 'نص الخبر';
        bodyField.rows = 8;
      }
    }
    kindSelect.addEventListener('change', syncLabel);
    syncLabel();
  </script>
{% endblock %}
